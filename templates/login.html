<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorized Access | Cyber Sentinel AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 2rem;
            border: 1px solid rgba(0, 242, 254, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container i.main-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .input-group {
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .input-wrapper input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.8rem;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .login-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 1rem;
            font-size: 1rem;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: var(--bg-dark);
            border: none;
            font-weight: 800;
            cursor: pointer;
            border-radius: 0.8rem;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <i class="fas fa-user-shield main-icon"></i>
        <h2>SYSTEM ACCESS</h2>
        <p>IDENTIFICATION REQUIRED TO PROCEED</p>

        {% if error %}
        <div class="error-msg">
            <i class="fas fa-triangle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fas fa-fingerprint"></i>
                    <input type="text" name="secret_id" placeholder="ENTER SECRET ID" required autofocus>
                </div>
                <button type="submit" class="login-btn">AUTHORIZE ACCESS</button>
            </div>
        </form>

        <div style="margin-top: 2rem; font-size: 0.7rem; color: #475569; letter-spacing: 1px;">
            SECURE ENCRYPTED HANDSHAKE v4.0.2
        </div>
    </div>

</body>
</html>
